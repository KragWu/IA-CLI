[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-cli"
version = "0.1.0"
description = "CLI locale pour travailler avec des IA open source"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.6,<2",
    "langchain-ollama>=1.1,<2",
    "langgraph>=1.2,<2",
]

[project.scripts]
iacli = "iacli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "import-linter",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (erreurs)
    "W",   # pycodestyle (avertissements)
    "F",   # pyflakes
    "I",   # tri des imports
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # comprehensions
    "RUF", # règles spécifiques à ruff
]

ignore = ["E501"]  # longueur gérée par `ruff format`

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.coverage.run]
source = ["iacli"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = false

[tool.importlinter]
root_package = "iacli"

[[tool.importlinter.contracts]]
name = "Le domaine ne dépend d'aucune autre couche"
type = "forbidden"
source_modules = ["iacli.domain"]
forbidden_modules = ["iacli.services", "iacli.infrastructure", "iacli.adapters", "iacli.cli"]

[[tool.importlinter.contracts]]
name = "Les services ne dépendent ni de l'infrastructure ni des adapters"
type = "forbidden"
source_modules = ["iacli.services"]
forbidden_modules = ["iacli.infrastructure", "iacli.adapters", "iacli.cli"]

[[tool.importlinter.contracts]]
name = "Infrastructure et adapters sont indépendants l'un de l'autre"
type = "independence"
modules = ["iacli.infrastructure", "iacli.adapters"]
