[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-cli"
version = "0.1.0"
description = "CLI locale pour travailler avec des IA open source"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
iacli = "iacli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
