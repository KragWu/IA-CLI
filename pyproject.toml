[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-cli"
version = "0.1.0"
description = "CLI locale pour travailler avec des IA open source"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.6,<2",
    "langchain-ollama>=1.1,<2",
    "langgraph>=1.2,<2",
]

[project.scripts]
iacli = "iacli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (erreurs)
    "W",   # pycodestyle (avertissements)
    "F",   # pyflakes
    "I",   # tri des imports
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # comprehensions
    "RUF", # règles spécifiques à ruff
]

ignore = ["E501"]  # longueur gérée par `ruff format`

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
